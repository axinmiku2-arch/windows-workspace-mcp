name: Windows source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-preview.txt httpx==0.28.1
      - name: Compile and test isolated state
        run: |
          python -m compileall -q runtime vps cloud tests
          python -B -X utf8 test_development.py
